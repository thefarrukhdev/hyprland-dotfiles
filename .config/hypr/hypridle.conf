general {
    lock_cmd        = pidof hyprlock || hyprlock || swaylock -f -c 000000
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# ── Brightness: Dim before lock ───────────────────────────────────────────────
listener {
    timeout   = 480
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# ── Lock Warning: Notify 30 seconds before screen locks ───────────────────────
listener {
    timeout   = 570
    on-timeout = notify-send "🔒  Ekran qulflanyapti" "30 soniyadan so'ng qulflanadi..." \
                    --urgency=low --expire-time=25000 \
                    --hint="string:x-canonical-private-synchronous:hypr-lock-warn"
}

# ── Screen Lock ───────────────────────────────────────────────────────────────
listener {
    timeout   = 600
    on-timeout = loginctl lock-session
}

# ── Display Off ───────────────────────────────────────────────────────────────
listener {
    timeout   = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on && brightnessctl -r
}

# ── Sleep Warning: Notify 30 seconds before suspend ───────────────────────────
listener {
    timeout   = 1770
    on-timeout = notify-send "💤  Kompyuter uxlayapti" "30 soniyadan so'ng uxlaydi..." \
                    --urgency=low --expire-time=25000 \
                    --hint="string:x-canonical-private-synchronous:hypr-sleep-warn"
}

# ── Suspend ───────────────────────────────────────────────────────────────────
listener {
    timeout   = 1800
    on-timeout = systemctl suspend
}
