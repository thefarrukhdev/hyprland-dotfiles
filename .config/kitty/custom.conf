# --- Otimizatsiya va Tezlashtirish (Optimizations) ---

# Dasturni yangilanishini tekshirishni o'chirish (ochilish tezligini oshiradi)
update_check_interval 0

# Kiritish (klaviatura) kechikishini minimal darajaga tushirish (input lag)
input_delay 1

# Kadrlar yangilanishini tezlashtirish (monitorga moslashishni o'chirib, eng yuqori FPS da ishlash)
sync_to_monitor no
repaint_delay 8

# Wayland'da kiritish usullarini (IME) o'chirish (agar faqat lotin/kirill yozsangiz, bu ham tezlashtiradi)
wayland_enable_ime no

# Kursor matn yozilayotganda ligaturalarni (birlashgan harflarni) o'chirish (rendering tezligini oshiradi)
disable_ligatures cursor
